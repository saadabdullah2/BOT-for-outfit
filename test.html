<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Recommendation Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
            background: white;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .results-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .results-header h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .results-header p {
            color: #666;
            font-size: 1.1em;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .product-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tag {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            color: #666;
        }

        .tag.featured {
            background: #667eea;
            color: white;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .product-price {
            font-size: 1.4em;
            font-weight: 700;
            color: #667eea;
        }

        .similarity-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .availability {
            margin-top: 10px;
            font-size: 0.9em;
        }

        .available {
            color: #4caf50;
            font-weight: 600;
        }

        .unavailable {
            color: #f44336;
            font-weight: 600;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .back-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .quiz-card {
                padding: 25px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Fashion Recommendation Quiz</h1>
            <p>Find your perfect outfit with AI-powered recommendations</p>
        </div>

        <div id="quizSection" class="quiz-card">
            <form id="quizForm">
                <div class="form-group">
                    <label for="occasion">Occasion</label>
                    <select id="occasion" required>
                        <option value="">Select an occasion</option>
                        <option value="Wedding/Party">Wedding/Party</option>
                        <option value="Casual">Casual</option>
                        <option value="Formal">Formal</option>
                        <option value="Festive">Festive</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="style">Style</label>
                    <select id="style" required>
                        <option value="">Select a style</option>
                        <option value="Elegant/Luxury">Elegant/Luxury</option>
                        <option value="Casual/Comfortable">Casual/Comfortable</option>
                        <option value="Traditional">Traditional</option>
                        <option value="Modern">Modern</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fabric">Fabric</label>
                    <select id="fabric" required>
                        <option value="">Select fabric</option>
                        <option value="Silk">Silk</option>
                        <option value="Cotton">Cotton</option>
                        <option value="Lawn">Lawn</option>
                        <option value="Chiffon">Chiffon</option>
                        <option value="Velvet">Velvet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="color">Color</label>
                    <input type="text" id="color" placeholder="e.g., red and gold" required>
                </div>

                <div class="form-group">
                    <label for="budget">Budget (PKR)</label>
                    <select id="budget" required>
                        <option value="">Select budget range</option>
                        <option value="PKR 5,000 - 10,000">PKR 5,000 - 10,000</option>
                        <option value="PKR 10,000 - 20,000">PKR 10,000 - 20,000</option>
                        <option value="PKR 20,000 - 30,000">PKR 20,000 - 30,000</option>
                        <option value="PKR 30,000+">PKR 30,000+</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="preference">Preference</label>
                    <select id="preference" required>
                        <option value="">Select preference</option>
                        <option value="Embroidered">Embroidered</option>
                        <option value="Printed">Printed</option>
                        <option value="Plain">Plain</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="apiUrl">API URL (Optional)</label>
                    <input type="text" id="apiUrl" placeholder="http://localhost:8000/quiz" value="http://localhost:8000/quiz">
                </div>

                <button type="submit" class="submit-btn">Find My Perfect Outfit</button>
            </form>
        </div>

        <div id="loadingSection" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Finding your perfect recommendations...</p>
        </div>

        <div id="resultsSection" class="results">
            <button class="back-btn" onclick="resetQuiz()">← Back to Quiz</button>
            
            <div class="results-header">
                <h2>Your Personalized Recommendations</h2>
                <p id="analyzedQuery"></p>
                <p id="resultCount"></p>
            </div>

            <div class="products-grid" id="productsGrid"></div>
        </div>

        <div id="errorSection" style="display: none;"></div>
    </div>

    <script>
        const form = document.getElementById('quizForm');
        const quizSection = document.getElementById('quizSection');
        const loadingSection = document.getElementById('loadingSection');
        const resultsSection = document.getElementById('resultsSection');
        const errorSection = document.getElementById('errorSection');
        const productsGrid = document.getElementById('productsGrid');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const answers = {
                occasion: document.getElementById('occasion').value,
                style: document.getElementById('style').value,
                fabric: document.getElementById('fabric').value,
                color: document.getElementById('color').value,
                budget: document.getElementById('budget').value,
                preference: document.getElementById('preference').value
            };

            const apiUrl = document.getElementById('apiUrl').value || 'http://localhost:8000/quiz';

            quizSection.style.display = 'none';
            loadingSection.style.display = 'block';
            errorSection.style.display = 'none';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        answers: answers,
                        collection_name: 'products',
                        top_k: 5
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                console.error('Error:', error);
                loadingSection.style.display = 'none';
                errorSection.style.display = 'block';
                errorSection.innerHTML = `
                    <div class="error">
                        <h3>⚠️ Error</h3>
                        <p>${error.message}</p>
                        <p>Make sure your API is running at ${apiUrl}</p>
                        <button class="back-btn" onclick="resetQuiz()" style="margin-top: 15px; background: white; color: #f44336;">Try Again</button>
                    </div>
                `;
            }
        });

        function displayResults(data) {
            loadingSection.style.display = 'none';
            resultsSection.classList.add('show');

            document.getElementById('analyzedQuery').textContent = `Search Query: ${data.analyzed_query}`;
            document.getElementById('resultCount').textContent = `Found ${data.count} perfect matches for you!`;

            productsGrid.innerHTML = '';

            data.recommendations.forEach(product => {
                const card = createProductCard(product);
                productsGrid.appendChild(card);
            });
        }

        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            const tags = product.tags ? product.tags.split(',').slice(0, 4) : [];
            const isAvailable = product.available === 'True' || product.available === 'true';
            const similarityPercent = Math.round(product.similarity_score * 100);

            card.innerHTML = `
                <img src="${product.image_url}" alt="${product.name}" class="product-image" 
                     onerror="this.src='https://via.placeholder.com/350x350?text=No+Image'">
                <div class="product-info">
                    <h3 class="product-name">${product.name}</h3>
                    <p class="product-description">${product.description}</p>
                    
                    ${tags.length > 0 ? `
                        <div class="product-tags">
                            ${tags.map((tag, i) => `<span class="tag ${i === 0 ? 'featured' : ''}">${tag.trim()}</span>`).join('')}
                        </div>
                    ` : ''}
                    
                    <div class="product-footer">
                        <span class="product-price">${product.price}</span>
                        <span class="similarity-badge">${similarityPercent}% Match</span>
                    </div>
                    
                    <div class="availability">
                        Status: <span class="${isAvailable ? 'available' : 'unavailable'}">
                            ${isAvailable ? '✓ Available' : '✗ Out of Stock'}
                        </span>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => {
                if (product.url) {
                    window.open(product.url, '_blank');
                }
            });

            return card;
        }

        function resetQuiz() {
            quizSection.style.display = 'block';
            resultsSection.classList.remove('show');
            errorSection.style.display = 'none';
            loadingSection.style.display = 'none';
            form.reset();
        }
    </script>
</body>
</html>
